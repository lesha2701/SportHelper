# Local development stack — NOT for production (see docker-compose.yml for
# that: Caddy + HTTPS + a real DOMAIN). This one runs Postgres + backend
# (hot reload) + bot + the Vite dev server, all reachable from the host over
# plain HTTP so the Mini App can be opened directly in a regular browser
# without a tunnel.
#
# Usage (from the repo root, with .env filled in):
#   docker compose -f docker-compose.dev.yml up --build
#
# Then:
#   http://localhost:8002/docs   — Swagger
#   http://localhost:5175        — frontend, logs in as a fixed dev user
#                                   automatically (DEV_AUTH_ENABLED in .env —
#                                   see docs/dev-notes.md), no Telegram needed
#
# Ports are 8002/5175/5433, not the usual 8000/5173/5432 — this machine runs
# several other Docker projects that already hold those. Change them below
# if that's not the case for you.
#
# The bot calls the Telegram API as soon as it starts, so it needs a real
# TELEGRAM_BOT_TOKEN in .env — it's behind a profile so a plain `up` above
# skips it. Once the token is set, start it explicitly:
#   docker compose -f docker-compose.dev.yml --profile bot up bot

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    ports:
      # 5433, not 5432 — avoids clashing with a native Postgres install from
      # the README's non-Docker setup, if one is still running on the host.
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    # --reload here (the prod image doesn't use it) so backend code edits on
    # the host apply without rebuilding the container.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:8002:8000"

  bot:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    profiles: ["bot"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: ["python", "run_bot.py"]
    volumes:
      - ./backend:/app/backend
      - ./database:/app/database
    depends_on:
      backend:
        condition: service_healthy

  frontend:
    image: node:20-alpine
    working_dir: /app
    # vite.config.ts already binds host 0.0.0.0:5173, so no extra flags are
    # needed here. VITE_API_BASE_URL overrides the checked-in
    # frontend/.env.development (which points at :8000, the non-Docker
    # README default) — env vars set here always win over .env-file values
    # in Vite, so the browser hits backend on the remapped :8002 below.
    environment:
      VITE_API_BASE_URL: http://localhost:8002
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend_node_modules_dev:/app/node_modules
    ports:
      - "5175:5173"
    depends_on:
      - backend

volumes:
  pgdata_dev:
  frontend_node_modules_dev:
